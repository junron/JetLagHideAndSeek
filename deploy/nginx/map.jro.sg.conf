server {
    listen 80;
    listen [::]:80;
    server_name map.jro.sg;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name map.jro.sg;

    ssl_certificate /etc/letsencrypt/live/map.jro.sg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.jro.sg/privkey.pem;

    root /var/www/map-app;

    auth_basic "Jet Lag Map";
    auth_basic_user_file /etc/nginx/.htpasswd-map;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        return 302 /;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 7d;
    }

    location /~partytown/ {
        try_files $uri =404;
        expires 7d;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 7d;
    }

    location ~ ^/(sgmrt|singapore|coastline50|ElectoralBoundary2025GEOJSON|Hawker|Libraries|Museums|Parks|Supermarkets)\.geojson$ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ ^/(JLIcon|android-chrome-192x192|android-chrome-512x512|apple-touch-icon|favicon-16x16|favicon-32x32|marker-icon|marker-icon-2x|marker-shadow|notification-icon-v2|notification-badge-v2|notification-icon-v3|notification-badge-v3|notification-banner-v2)\.(png|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
