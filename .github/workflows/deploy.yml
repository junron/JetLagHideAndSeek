name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.34.5
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run tests
              run: pnpm vitest run --maxWorkers=1 --minWorkers=1
            - name: Build backend
              run: pnpm build:server
            - name: Check multiplayer source quality
              run: >-
                  pnpm exec eslint
                  server/src/app.ts server/src/index.ts
                  src/game/multiplayer.ts
                  src/components/game/MultiplayerPanel.tsx
                  src/components/cards/base.tsx
                  src/pwa.ts src/sw.ts
            - name: Check formatting
              run: >-
                  pnpm exec prettier --check
                  astro.config.mjs compose.yaml
                  server/src/app.ts server/src/index.ts
                  src/game/multiplayer.ts
                  src/components/game/MultiplayerPanel.tsx
                  src/components/cards/base.tsx
                  src/pwa.ts src/sw.ts
                  tests/multiplayer.server.test.ts
                  tests/multiplayer.client.test.ts

    build:
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v4
            - name: Install, build, and upload your site
              uses: withastro/action@v3
              with:
                  path: . # The root location of your Astro project inside the repository. (optional)
                  node-version: 22 # Match the backend and local production toolchain.
                  package-manager: pnpm@10.34.5 # Keep installs reproducible with the lockfile.

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
